# Fork this repo, then in the Cloudflare dashboard connect the GitHub repo.
# Build command: npm run build:worker
# Deploy command: npx wrangler deploy
# The site and the /signal handshake are this one Worker. The match runs in the browser.
name = "stronghold-protocol"
main = "worker/index.js"
compatibility_date = "2026-04-01"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/signal"]

[[durable_objects.bindings]]
name = "HUB"
class_name = "Hub"

[[migrations]]
tag = "v1"
new_classes = ["Hub"]
